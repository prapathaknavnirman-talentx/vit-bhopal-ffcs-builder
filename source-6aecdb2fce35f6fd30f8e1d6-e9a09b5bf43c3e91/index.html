        const MAX_CREDITS = 27;
        const STORAGE_KEY = 'vit_ffcs_plans_v2';
        const DAYS = Object.keys(TIMETABLE_MATRIX);

        // Slot code -> list of { day, period } it occupies
        const SLOT_INDEX = (() => {
            const idx = {};
            Object.entries(TIMETABLE_MATRIX).forEach(([day, periods]) => {
                Object.entries(periods).forEach(([period, slot]) => {
                    (idx[slot] = idx[slot] || []).push({ day, period });
                });
            });
            return idx;
        })();

        const ALL_FACULTY = Array.from(new Set(INITIAL_SUBJECTS.flatMap(s => s.options.map(o => o.faculty)))).sort();

        // ==========================================
        // 2. HELPERS
        // ==========================================
        const totalCredits = (selections) => selections.reduce((sum, s) => sum + s.credits, 0);

        function buildLookup(selections) {
            const lookup = {};
            selections.forEach(sel => {
                sel.option.slots.forEach(slot => {
                    (SLOT_INDEX[slot] || []).forEach(({ day, period }) => {
                        const key = `${day}-${period}`;
                        (lookup[key] = lookup[key] || []).push({ code: sel.code, faculty: sel.option.faculty, venue: sel.option.venue, slot });
                    });
                });
            });
            return lookup;
        }

        function slotConflicts(selections, subjectCode, option) {
            const cells = new Set(option.slots.flatMap(slot => (SLOT_INDEX[slot] || []).map(({ day, period }) => `${day}-${period}`)));
            return selections.filter(s => s.code !== subjectCode && s.option.slots.some(slot =>
                (SLOT_INDEX[slot] || []).some(({ day, period }) => cells.has(`${day}-${period}`))));
        }

        function checkClashes(selections) {
            const lookup = buildLookup(selections);
            return Object.entries(lookup)
                .filter(([, items]) => items.length > 1)
                .map(([key, items]) => ({ key, items }));
        }

        // CR rooms are in the AB-1 / LC / AR group; Linux Administration is online.

        function campusZone(venue) {
            const room = (venue || '').toUpperCase().replace(/\s+/g, '');
            if (/^AB-?0?2(?:-|$)/.test(room)) return 'ab02';
            if (/^(?:AB(?:-?0?1)?|LC|AR|CR)(?:-|$)/.test(room)) return 'central';

        const compareRoutine = (a, b, profile) =>
            a.metrics.unknownVenueClasses - b.metrics.unknownVenueClasses ||
            Math.round(a.metrics.walkingKm * 10) - Math.round(b.metrics.walkingKm * 10) ||
            a.metrics.clashPeriods - b.metrics.clashPeriods ||
            a.metrics.crossings - b.metrics.crossings ||
            a.metrics.morningDepartureKm - b.metrics.morningDepartureKm ||
            a.metrics.restartKm - b.metrics.restartKm ||
            profile.score(a.metrics) - profile.score(b.metrics) || a.key.localeCompare(b.key);

        const STUDENT_CATEGORIES = {
            day: { label: 'Day scholar', origin: 'Campus entrance', ab02: 1, central: 0.5 },
            boys: { label: 'Boys hostel', origin: 'Boys hostel', ab02: 0.5, central: 2.2 },
            girls: { label: 'Girls hostel', origin: 'Girls hostel', ab02: 0.4, central: 1.2 }
        };
        const CLASS_MINUTES = Object.fromEntries(PERIOD_TIMINGS.map(p =>
            [Number(p.id.slice(1)), p.time.split(' - ').map(t => {
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            })]));

        function scheduleMetrics(combo, returnForLunch = false, category = 'boys') {
            const origin = STUDENT_CATEGORIES[category];
            const lookup = buildLookup(combo);
            const m = { days: 0, gaps: 0, span: 0, early: 0, morning: 0, late: 0, periodSum: 0, startSum: 0, finishSum: 0, afternoonDistance: 0, loadSquares: 0, maxLoad: 0, saturday: 0, fridayFinish: 0, crossings: 0, walkingKm: 0, hostelKm: 0, morningDepartureKm: 0, restartKm: 0, lunchReturns: 0, dailyTravel: [], unknownVenueClasses: 0, clashPeriods: checkClashes(combo).length };
            DAYS.forEach(day => {
                const periods = Object.keys(TIMETABLE_MATRIX[day])
                    .filter(period => lookup[`${day}-${period}`]).map(period => Number(period.slice(1))).sort((a, b) => a - b);
                if (!periods.length) return;
                const start = Math.min(...periods), finish = Math.max(...periods);
                if (periods.some(period => lookup[`${day}-P${period}`].some(item => item.venue !== 'Online'))) m.days++;
                m.startSum += start;
                m.finishSum += finish;
                m.span += finish - start + 1;
                m.gaps += finish - start + 1 - periods.length;
                m.loadSquares += periods.length ** 2;
                m.maxLoad = Math.max(m.maxLoad, periods.length);
                if (day === 'Saturday') m.saturday = periods.length;
                if (day === 'Friday') m.fridayFinish = finish;
                let previousZone = null;
                let previousPeriod = null;
                let dailyKm = 0;
                let lunchReturn = false;
                const route = [origin.origin];
                periods.forEach(period => {
                    // Include every overlapping venue rather than hiding travel behind the first class.
                    const items = lookup[`${day}-P${period}`];
                    const stops = [...new Map(items.map(item => [campusZone(item.venue) || item.venue, item])).values()];
                    stops.forEach(item => {
                    const zone = campusZone(item.venue);
                    if (zone) {
                        // An optional hostel lunch needs 90 free minutes within 12:30–14:30.
                        // Online classes reserve their full time, so cannot create a lunch gap.
                        const freeLunchGap = previousPeriod !== null &&
                            Math.min(CLASS_MINUTES[period][0], 14 * 60 + 30) -
                            Math.max(CLASS_MINUTES[previousPeriod][1], 12 * 60 + 30) >= 90 &&
                            !periods.some(p => p > previousPeriod && p < period);
                        if (!previousZone) {
                            dailyKm += origin[zone];
                            m.hostelKm += origin[zone];
                            if (period <= 3) m.morningDepartureKm += origin[zone];
                        } else if (returnForLunch && freeLunchGap) {
                            const trip = origin[previousZone] + origin[zone];
                            dailyKm += trip;
                            m.hostelKm += trip;
                            m.restartKm += origin[zone];
                            m.lunchReturns++;
                            lunchReturn = true;
                            route.push(`${origin.origin} (lunch)`);
                        } else if (previousZone !== zone) {
                            m.crossings++;
                            dailyKm += 1.5;
                        }
                        const label = zone === 'ab02' ? 'AB-02' : 'AB-01 / LC / AR';
                        if (route[route.length - 1] !== label) route.push(label);
                        previousZone = zone;
                        previousPeriod = period;
                    } else if (item.venue !== 'Online') {
                        m.unknownVenueClasses++;
                    }
                    });
                    m.periodSum += period;
                    m.early += period <= 2 ? 1 : 0;
                    m.morning += period <= 3 ? 1 : 0;
                    m.late += period >= 6 ? 1 : 0;
                    m.afternoonDistance += Math.min(Math.abs(period - 4), Math.abs(period - 5));
                });
                if (previousZone) {
                    dailyKm += origin[previousZone];
                    m.hostelKm += origin[previousZone];
                    route.push(origin.origin);
                    m.dailyTravel.push({ day, km: dailyKm, route, lunchReturn });
                    m.walkingKm += dailyKm;
                }
            });
            return m;
        }

        // Faculty-only changes do not count as different timetables.
        const scheduleKey = combo => combo.map(s => `${s.code}:${[...s.option.slots].sort().join(',')}`).sort().join('|');

        function teacherChoices(selection) {
            const current = selection.option;
            const slots = [...current.slots].sort().join(',');
            const zone = campusZone(current.venue);
            const building = venue => {
                const room = venue.toUpperCase().replace(/\s+/g, '');
                if (campusZone(venue) === 'ab02') return 'AB-02';
                if (/^LC-/.test(room)) return 'LC';
                if (/^AR-/.test(room)) return 'AR';
                if (/^AB(?:-?0?1)?-/.test(room)) return 'AB-01';
                return null;
            };
            const proximity = option => {
                if (option.venue === 'Online') return 'Online';
                if (!campusZone(option.venue)) return 'Location unspecified';
                if (building(current.venue) && building(current.venue) === building(option.venue)) return 'Same building';
                return 'Nearby building group';
            };
            const subject = INITIAL_SUBJECTS.find(s => s.code === selection.code);
            return (subject ? subject.options : [current])
                .filter(option => [...option.slots].sort().join(',') === slots &&
                    (option.id === current.id ||
                        (zone && campusZone(option.venue) === zone) ||
                        (current.venue === 'Online' && option.venue === 'Online')))
                .map(option => ({ option, location: proximity(option) }))
                .sort((a, b) => (a.location === 'Nearby building group') - (b.location === 'Nearby building group') ||
                    a.option.faculty.localeCompare(b.option.faculty) || a.option.venue.localeCompare(b.option.venue));
        }

        function generateCombos(subjects, returnForLunch = false, category = 'boys', clashFree = false) {
            subjects = subjects.filter(subject => subject.slotBased !== false);
            if (!subjects.length) return [];
            const ordered = subjects.map(subject => {
                const patterns = new Map();
                subject.options.forEach(option => {
                    if (!option.slots.length || option.slots.some(slot => !SLOT_INDEX[slot])) return;
                    const key = `${[...option.slots].sort().join(',')}:${campusZone(option.venue) || 'unknown'}`;
                    if (!patterns.has(key)) patterns.set(key, option);
                });
                return { ...subject, options: [...patterns.values()] };
            }).sort((a, b) => a.options.length - b.options.length || a.code.localeCompare(b.code));
            const unavailable = ordered.find(subject => !subject.options.length);
            if (unavailable) throw new Error(`${unavailable.code} has no listed timetable slots.`);
            const candidates = new Map();
            // Search independently for each routine so the original faculty order
            // cannot fill every result with the same morning or evening pattern.
            STUDENT_PROFILES.forEach(profile => {
                let beam = [{ combo: [], used: new Set(), metrics: scheduleMetrics([], returnForLunch, category), key: '' }];
                for (const subject of ordered) {
                    const next = [];
                    beam.forEach(state => subject.options.forEach(option => {
                        const cells = option.slots.flatMap(slot => SLOT_INDEX[slot].map(cell => `${cell.day}-${cell.period}`));
                        if (clashFree && cells.some(cell => state.used.has(cell))) return;
                        const combo = [...state.combo, { ...subject, option }];
                        next.push({ combo, used: new Set([...state.used, ...cells]), metrics: scheduleMetrics(combo, returnForLunch, category), key: combo.map(s => `${s.code}:${s.option.slots.slice().sort().join(',')}:${campusZone(s.option.venue) || 'unknown'}`).sort().join('|') });
                    }));
                    next.sort((a, b) => compareRoutine(a, b, profile));
                    beam = next.slice(0, 600);
                    if (!beam.length) break;
                }
                beam.filter(state => state.combo.length === ordered.length).forEach(state => {
                    const key = scheduleKey(state.combo);
                    const existing = candidates.get(key);
                    if (!existing || compareRoutine(state, { metrics: scheduleMetrics(existing, returnForLunch, category), key: state.key }, profile) < 0) {
                        candidates.set(key, state.combo);
                    }
                });
            });
            const searchSpace = ordered.reduce((n, subject) => n * subject.options.length, 1);
            // Enumerate feasible schedules for small selections; use a bounded fallback for large searches.
            if (searchSpace <= 50000 || candidates.size < 10) {
                let visited = 0;
                const exhaustive = searchSpace <= 50000;
                const visit = (index, combo, occupied) => {
                    if (++visited > 250000 || (!exhaustive && candidates.size >= 10)) return;
                    if (index === ordered.length) {
                        const key = scheduleKey(combo);
                        const existing = candidates.get(key);
                        if (!existing || compareRoutine(
                            { metrics: scheduleMetrics(combo, returnForLunch, category), key },
                            { metrics: scheduleMetrics(existing, returnForLunch, category), key }, STUDENT_PROFILES[0]) < 0) candidates.set(key, combo);
                        return; 
                    }
                    const subject = ordered[index];
                    for (const option of subject.options) {
                        const cells = option.slots.flatMap(slot => SLOT_INDEX[slot].map(cell => `${cell.day}-${cell.period}`));
                        if (clashFree && cells.some(cell => occupied.has(cell))) continue;
                        visit(index + 1, [...combo, { ...subject, option }], new Set([...occupied, ...cells]));
                        if (!exhaustive && candidates.size >= 10) break;
                    }
                };
                visit(0, [], new Set());
            }
            const available = [...candidates.entries()]
                .filter(([, combo]) => !clashFree || checkClashes(combo).length === 0)
                .map(([key, combo]) => ({ key, combo, metrics: scheduleMetrics(combo, returnForLunch, category) }));
            if (!available.length) throw new Error(searchSpace <= 50000
                ? 'No clash-free combination exists for these courses using the listed slots. Change your course selection and try again. No timetable has been created.'
                : 'No clash-free combination was found within the search limit. Try a smaller course selection or different courses. No timetable has been created.');
            if (clashFree) return available;
            // Keep all ten routine styles, including those needing conflict resolution.
            const routines = STUDENT_PROFILES.map(profile => ({
                ...[...available].sort((a, b) => compareRoutine(a, b, profile))[0], profile  
            }));
            let feasible = [];
            if (routines.some(result => result.metrics.clashPeriods)) {
                try { feasible = generateCombos(subjects, returnForLunch, category, true); }
                catch (error) {
                    return routines.map(result => ({ ...result, alternatives: [], resolutionError: error.message }));
                }
            }
            return routines.map(result => ({ ...result, alternatives: result.metrics.clashPeriods
                ? rankRepairs(result.combo, feasible, result.profile).slice(0, 3) : [] })); 
        }

        function rankRepairs(original, feasible, profile) {
            const changes = candidate => original.filter(selection => {
                const replacement = candidate.combo.find(s => s.code === selection.code);
                return replacement.option.slots.slice().sort().join(',') !== selection.option.slots.slice().sort().join(',');
            }).length;
            return [...feasible].sort((a, b) => changes(a) - changes(b) || compareRoutine(a, b, profile));
        }

        function loadPlans() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (Array.isArray(saved) && saved.length) return saved.map(plan => ({
                    ...plan,
                    selections: plan.selections.map(selection => selection.code === 'CSE0002'
                        ? { ...selection, option: { ...selection.option, venue: 'Online' } }
                        : selection)
                }));
            } catch (e) {}
            return [
                { id: 'plan-1', name: 'Plan 1 - Preferred', selections: [] },
                { id: 'plan-2', name: 'Plan 2 - Morning Focus', selections: [] }
            ];
        }

        // ==========================================
        // 3. COMPONENTS

        const COURSE_PALETTE = [
            ['#eff6ff', '#1e40af', '#bfdbfe', '#3b82f6'],
            ['#ecfdf5', '#065f46', '#a7f3d0', '#10b981'],
            ['#fff7ed', '#9a3412', '#fed7aa', '#f97316'],
            ['#f5f3ff', '#5b21b6', '#ddd6fe', '#8b5cf6'],
            ['#fff1f2', '#9f1239', '#fecdd3', '#f43f5e'],
            ['#ecfeff', '#155e75', '#a5f3fc', '#06b6d4'],
            ['#fefce8', '#854d0e', '#fef08a', '#ca8a04'],
            ['#fdf4ff', '#86198f', '#f5d0fe', '#d946ef']
        ];

            return { '--course-bg': bg, '--course-ink': ink, '--course-border': border, '--course-accent': accent };
        };

        function TimetableGrid({ selections }) {

            return (

                            <p>Class times, faculty &amp; rooms in one place.</p>
                            <p>Lunch window: 12:30–14:30 (12:30–2:30 pm). Choose when to eat around your classes; the college has no fixed lunch period.</p>
                        </div>
                        <div className="planner-week"><Calendar size={14} /> Monday – Saturday</div>
                    </div>
                    {!selections.length && <div className="planner-empty"><strong>Your week starts here.</strong> Add courses in Subjects or apply a plan from the Generator to fill your timetable.</div>}
                    <div className="planner-hint no-print">Scroll horizontally to see all periods →</div>
                    <div className="planner-scroll custom-scrollbar" tabIndex={0} role="region" aria-label="Scrollable weekly schedule">
                        <table className="planner-table">
                            <caption className="sr-only">Weekly course schedule with time slots, faculty and venues, Monday through Saturday.</caption>
                            <thead>
                                <tr>
                                    <th scope="col" className="planner-day">Day / Time</th>
                                    {PERIOD_TIMINGS.map(p => (

                                    return (

                                            {PERIOD_TIMINGS.map(p => {

                    </div>}

                                className="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />

                    </div>

                    {filtered.length === 0 && <div className="text-center py-12 text-slate-400 text-sm">No subjects match your filters.</div>}

                    <div className="space-y-4">
                        {filtered.map(subject => {
                            const chosen = plan.selections.find(s => s.code === subject.code);
                            const options = faculty === 'All' ? subject.options : subject.options.filter(o => o.faculty === faculty);
                            return (
                                <div key={subject.code} className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                                    <div className="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-start gap-2">

                                                <div className="text-xs text-slate-600 mt-1">
                                                    {options.length} of {subject.options.length} faculty, slot &amp; venue options
                                                    {faculty !== 'All' && (
                                                        <button onClick={() => setFaculty('All')} className="ml-2 text-blue-700 underline rounded focus:outline-none focus:ring-2 focus:ring-blue-500">Show all {subject.options.length}</button>

                                                </div>

                                        <div className="flex flex-col items-end gap-2 shrink-0">
                                            <span className="text-xs px-2.5 py-1 bg-blue-100 text-blue-800 rounded-full font-bold">{subject.credits} Credits</span>

                                        {options.map(opt => {
                                            const selected = chosen?.option.id === opt.id;
                                            const conflicts = slotConflicts(plan.selections, subject.code, opt);
                                            const unavailable = conflicts.length > 0;
                                            const conflictMessage = conflicts.map(s =>
                                                `${s.option.slots.filter(slot => opt.slots.includes(slot)).join(' + ')} already selected in ${s.code} (${s.title})`
                                            ).join('; ');
                                            return (
                                                <div key={opt.id} className={`p-2.5 rounded-lg border text-xs flex justify-between items-center gap-2 ${unavailable ? 'bg-amber-50 border-amber-200' : selected ? 'bg-blue-50 border-blue-500' : 'border-slate-200'}`}>
                                                    <div>
                                                        <div className="font-bold text-slate-800">{opt.faculty}</div>
                                                        <div className="text-slate-500 mt-0.5">Slots: <span className="font-mono text-blue-700 font-semibold">{opt.slots.join(' + ')}</span> · Venue: {opt.venue}</div>
                                                        {unavailable && <div id={`conflict-${subject.code}-${opt.id}`} className="text-amber-800 mt-1">Cannot select: {conflictMessage}. Change or remove that subject’s selection to free this slot.</div>}
                                                    </div>
                                                    <button onClick={() => onSelect(subject, opt)} disabled={unavailable}
                                                        aria-describedby={unavailable ? `conflict-${subject.code}-${opt.id}` : undefined}
                                                        className={`px-3 py-1.5 rounded-md font-medium shrink-0 transition-colors ${unavailable ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : selected ? 'bg-emerald-600 text-white' : 'bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700'}`}>
                                                        {unavailable ? (selected ? 'Selected · Conflict' : 'Unavailable') : selected ? 'Selected' : 'Choose'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ReviewsSection() {
            const [rating, setRating] = useState(0);
            const [name, setName] = useState('');
            const [comment, setComment] = useState('');
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [loadError, setLoadError] = useState('');
            const [message, setMessage] = useState('');
            const [error, setError] = useState('');
            const [sending, setSending] = useState(false);
            const load = async () => {
                setLoading(true); setLoadError('');
                try {
                    const response = await fetch('/api/reviews');
                    if (!response.ok) throw new Error();
                    setData(await response.json());
                } catch { setLoadError('Could not load reviews.'); }
                finally { setLoading(false); }
            };
            useEffect(() => { load(); }, []);
            const submit = async (event) => {
                event.preventDefault();
                if (sending) return;
                setError(''); setMessage('');
                if (!rating) { setError('Choose a star rating before submitting.'); return; }
                setSending(true);
                try {
                    const response = await fetch('/api/reviews', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, rating, comment, website: new FormData(event.currentTarget).get('website') }),
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Unable to save your review. Please try again.');
                    setMessage('Thank you! Your review has been shared.');
                    setName(''); setComment(''); setRating(0);
                    await load();
                } catch (err) { setError(err.message || 'Unable to save your review. Please try again.'); }
                finally { setSending(false); }
            };
            return (
                <section aria-labelledby="reviews-title" className="no-print mb-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <p className="institution-kicker">Help improve the planner</p>
                            <h3 id="reviews-title" className="text-xl font-bold text-slate-800 mt-1">How was your timetable experience?</h3>
                            <p className="text-sm text-slate-500 mt-2">Rate the builder and share what worked or what needs fixing.</p>
                            <form onSubmit={submit} className="space-y-3 mt-4">
                                <fieldset disabled={sending}>
                                    <legend className="text-sm font-semibold text-slate-700">Your rating (required)</legend>
                                    <div className="flex gap-3 mt-2">
                                        {[1, 2, 3, 4, 5].map(value => <label key={value} className="cursor-pointer text-center">
                                            <input type="radio" name="rating" value={value} checked={rating === value} onChange={() => setRating(value)} className="peer sr-only" required />
                                            <span aria-hidden="true" className={`block text-3xl rounded peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-slate-700 ${value <= rating ? 'text-amber-600' : 'text-slate-300'}`}>★</span>
                                            <span className="sr-only">{value} {value === 1 ? 'star' : 'stars'}</span>
                                        </label>)}
                                    </div>
                                </fieldset>
                                <label className="block text-sm text-slate-700">Your name
                                    <input required maxLength={80} autoComplete="name" value={name} onChange={e => setName(e.target.value)} disabled={sending} className="block w-full mt-1 rounded-md border border-slate-300 p-2" />
                                </label>
                                <label className="block text-sm text-slate-700">Your review
                                    <textarea required maxLength={1500} rows={3} value={comment} onChange={e => setComment(e.target.value)} disabled={sending} className="block w-full mt-1 rounded-md border border-slate-300 p-2" placeholder="Tell us about your experience…" />
                                </label>
                                <div hidden aria-hidden="true"><label>Leave empty<input name="website" tabIndex={-1} autoComplete="off" /></label></div>
                                <p className="text-xs text-slate-500">Your name, rating and review are public. Please avoid sharing personal details.</p>
                                <button disabled={sending} className="rounded-md bg-slate-800 hover:bg-slate-700 disabled:opacity-60 text-white px-4 py-2 text-sm font-semibold">{sending ? 'Submitting…' : 'Submit review'}</button>
                                {error && <p role="alert" className="text-sm text-red-700">{error}</p>}
                                {message && <p role="status" className="text-sm text-emerald-700">{message}</p>}
                            </form>
                        </div>
                        <div className="space-y-4">
                            <div className="rounded-lg bg-slate-50 p-4 text-sm">
                                <h4 className="font-bold text-slate-800">Contact Pranav Pathak</h4>
                                <p className="text-slate-500 mt-1">Found an issue or have a suggestion? Get in touch.</p>
                                <a className="block mt-2 underline break-all" href="mailto:pranavpathakscsr@gmail.com">pranavpathakscsr@gmail.com</a>
                                <a className="block mt-1 underline" href="tel:+918235491113">8235491113</a>
                            </div>
                            <div aria-live="polite">
                                <h4 className="font-semibold text-slate-800">Student reviews</h4>
                                {loading ? <p className="text-sm text-slate-500 mt-2">Loading reviews…</p> : loadError ? <p className="text-sm text-slate-600 mt-2">{loadError} <button onClick={load} className="underline">Try again</button></p> : data && <>
                                    <p className="text-sm text-slate-600 mt-1">{data.total ? `${data.average.toFixed(1)} / 5 · ${data.total} review${data.total === 1 ? '' : 's'}` : 'No reviews yet. Be the first to share your experience.'}</p>
                                    {data.reviews.map(review => <article key={review.id} className="border-t border-slate-200 mt-3 pt-3 text-sm">
                                        <div className="flex flex-wrap justify-between gap-2"><strong className="text-slate-700 break-words">{review.name}</strong><span className="text-amber-700">{review.rating} / 5 stars</span></div>
                                        <p className="text-slate-600 mt-1 whitespace-pre-wrap break-words">{review.comment}</p>
                                    </article>)}
                                    {data.total > 5 && <p className="mt-3 text-xs text-slate-500">Showing the 5 latest reviews. The average includes every review.</p>}
                                </>}
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function GeneratorTab({ onApply }) {
            const [picked, setPicked] = useState([]);
            const [results, setResults] = useState(null);
            const [generating, setGenerating] = useState(false);
            const [generationError, setGenerationError] = useState('');
            const [selectedAlternative, setSelectedAlternative] = useState(null);
            const [returnForLunch, setReturnForLunch] = useState(false);
            const [category, setCategory] = useState('');
            const student = STUDENT_CATEGORIES[category];

            const scheduledSubjects = INITIAL_SUBJECTS.filter(s => s.slotBased !== false);
            const pickedCredits = scheduledSubjects.filter(s => picked.includes(s.code)).reduce((a, s) => a + s.credits, 0);
            const changePicked = (codes) => {
                const subjects = scheduledSubjects.filter(s => codes.includes(s.code));
                if (totalCredits(subjects) > MAX_CREDITS) return;
                setPicked(subjects.map(s => s.code)); setResults(null); setSelectedAlternative(null); setGenerationError('');
            };
            const toggle = (code) => changePicked(picked.includes(code) ? picked.filter(c => c !== code) : [...picked, code]);

            const changeTeacher = (profileId, subjectCode, optionId) => {
                setResults(previous => previous.map(result => {
                    if (result.profile.id !== profileId || !result.combo) return result;
                    const selection = result.combo.find(s => s.code === subjectCode);
                    const choice = selection && teacherChoices(selection).find(({ option }) => option.id === optionId);
                    if (!choice) return result;
                    const combo = result.combo.map(s => s.code === subjectCode ? { ...s, option: choice.option } : s);
                    return { ...result, combo, metrics: scheduleMetrics(combo, returnForLunch, category) };
                }));
            };

            const run = () => {
                if (!category) return;
                if (!picked.length) return alert('Select at least one course to generate timetable options.');
                if (pickedCredits > MAX_CREDITS) return alert(`Selected courses total ${pickedCredits} credits, which exceeds the ${MAX_CREDITS} credit limit.`);
                setGenerationError('');
                setSelectedAlternative(null);
                setResults(null);
                setGenerating(true);
                setTimeout(() => {
                    try { setResults(generateCombos(scheduledSubjects.filter(s => picked.includes(s.code)), returnForLunch, category)); }
                    catch (error) { setResults(null); setGenerationError(error.message); }
                    finally { setGenerating(false); }
                }, 50);
            };

            return (
                <div className="space-y-6">
                    {results && <ReviewsSection />}
                    <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-4">
                        <div className="flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h2 className="font-bold text-slate-800 flex items-center gap-2"><Sparkles size={18} className="text-violet-600" /> Auto Generator</h2>
                                <p className="text-xs text-slate-500">Generate 10 routine styles. Any routine with clashes offers up to 3 replacements; select one to resolve all conflicts before creating your timetable. Selected: {picked.length} courses, {pickedCredits} credits.</p>
                                <p className="text-xs text-emerald-700 mt-2">Walking estimates include your starting point, classes, and return trip. AB-02 ↔ AB-01 / LC / AR is estimated at 1.5 km. Routines favor grouped classes and fewer crossings. CR rooms belong to AB-01 / LC / AR; Linux Administration is online.</p>
                            </div>
                            <div className="flex gap-2">

                                <button disabled={generating} onClick={() => changePicked([])} className="px-3 py-1.5 text-xs border border-slate-300 rounded-md hover:bg-slate-100">Clear</button>
                                <button onClick={run} disabled={generating || !category || !picked.length || pickedCredits > MAX_CREDITS} className="px-4 py-1.5 text-xs bg-violet-600 hover:bg-violet-700 disabled:opacity-60 text-white rounded-md font-medium flex items-center gap-1"><Sparkles size={14} /> {generating ? 'Generating routines…' : 'Generate 10 timetables'}</button>
                            </div>
                        </div>
                        <fieldset className="student-category" disabled={generating}>
                            <legend>01 / Your starting point</legend>
                            <p className="text-xs text-slate-500 mb-4">Which category of student are you? Choose one to calculate your walking routes.</p>
                            <div className="category-options">
                                {Object.entries(STUDENT_CATEGORIES).map(([id, item]) => <label key={id} className={`category-option ${category === id ? 'is-selected' : ''}`}>
                                    <input type="radio" name="student-category" value={id} checked={category === id} onChange={() => { setCategory(id); setReturnForLunch(false); setResults(null); }} />
                                    <span><strong>{item.label}</strong><small>AB-01 / LC / AR · {item.central} km<br />AB-02 · {item.ab02} km</small></span>
                                </label>)}
                            </div>
                            {student && <p className="text-xs text-slate-600 mt-3">Routes begin and end at {student.origin.toLowerCase()}. {category === 'day' ? 'Day-scholar distances are measured from your campus arrival point.' : 'Hostel departures and optional lunch returns use these distances.'}</p>}
                        </fieldset>
                        <div className="credit-budget" role="status" aria-live="polite">
                            <div className="flex flex-wrap justify-between gap-2 text-sm"><strong>{pickedCredits} / {MAX_CREDITS} credits selected</strong><span>{MAX_CREDITS - pickedCredits} credits remaining</span></div>
                            <progress value={pickedCredits} max={MAX_CREDITS} aria-label="Selected course credits" />
                            <p className="text-xs text-slate-600 mt-2">Maximum 27 credits per timetable. Courses exceeding your remaining allowance are unavailable; deselect a course to make room.</p>
                        </div>
                        {category && category !== 'day' && <label className="flex items-start gap-2 text-xs text-slate-600 rounded-lg border border-emerald-100 bg-emerald-50 p-3">
                            <input type="checkbox" disabled={generating} checked={returnForLunch} onChange={e => { setReturnForLunch(e.target.checked); setResults(null); }} className="mt-0.5" />
                            <span><strong>Choose hostel lunch when at least 90 minutes are free within 12:30–14:30 (12:30–2:30 pm).</strong> Lunch timing is your choice; the college has no fixed lunch period. This optional travel estimate reserves 90 minutes for the hostel trip and lunch, includes both hostel legs, and favors a shorter return journey. Otherwise, stay on campus until the last class to save walking. All classes, including online classes, keep their scheduled times; no extra hostel trips are assumed during other gaps.</span>
                        </label>}
                        <p className="text-xs text-slate-600">DSN2099 · Project Exhibition - II has no timetable slots and is excluded from routine generation. Its 1 credit is separate from the generated timetable’s selected credits; include it when checking your semester total.</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                            {scheduledSubjects.map(s => (
                                <label key={s.code} className={`p-3 border rounded-lg text-xs flex items-center gap-3 cursor-pointer transition-colors ${!picked.includes(s.code) && pickedCredits + s.credits > MAX_CREDITS ? 'credit-unavailable' : ''} ${picked.includes(s.code) ? 'border-violet-400 bg-violet-50' : 'border-slate-200 hover:bg-slate-50'}`}>
                                    <input type="checkbox" checked={picked.includes(s.code)} disabled={generating || (!picked.includes(s.code) && pickedCredits + s.credits > MAX_CREDITS)} onChange={() => toggle(s.code)} className="rounded" />
                                    <div className="min-w-0">
                                        <div className="font-bold text-slate-800">{s.code} <span className="font-normal text-slate-500">· {s.credits} cr</span></div>
                                        <div className="text-slate-500 truncate text-[11px]">{s.title}</div>
                                    </div>
                                </label>
                            ))}
                        </div>
                    </div>

                    {generationError && <p role="alert" className="text-sm text-amber-800">{generationError}</p>}
                    {results && (
                        <div className="space-y-3" aria-live="polite">
                            <h3 className="font-bold text-slate-800 text-sm">{results.filter(result => result.combo).length} timetable options · {student.label}</h3>
                            <p className="text-xs text-slate-500">All 10 routine styles include every selected course. For each routine with clashes, review its best available replacements below. Replacements prioritize fewer slot changes, then your travel preferences and routine style. Select a replacement that resolves every clash before creating that timetable. Search is bounded; fewer than 3 replacements may be available.</p>
                            <p className="text-xs text-slate-500">Different routine styles may recommend the same slots when those best fit your selected courses.</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {results.map(({ profile, combo, metrics, alternatives, resolutionError, resolved }, idx) => (
                                    <div key={profile.id} className="p-4 border border-slate-200 rounded-xl bg-white shadow-sm space-y-3 min-w-0">
                                        <div>
                                            <div className="text-[10px] font-bold uppercase tracking-wider text-violet-600">Routine {idx + 1} / {results.length}</div>
                                            <h4 className="font-bold text-slate-800">{profile.name}</h4>
                                            <p className="text-xs text-slate-500 mt-1">{profile.description}</p>
                                        </div>
                                        <>
                                            {!metrics.clashPeriods && <label className="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-900 cursor-pointer">
                                                <input type="radio" name="resolved-alternative" checked={selectedAlternative === profile.id} onChange={() => setSelectedAlternative(profile.id)} />
                                                Select this clash-free routine
                                            </label>}
                                            {resolved && <p className="text-xs text-emerald-700" role="status">Replacement selected. All conflicts resolved.</p>}
                                            {metrics.clashPeriods > 0 && <div className="rounded-lg border border-amber-200 bg-amber-50 p-3 space-y-3">
                                                <strong className="text-sm text-amber-900">Resolve this routine’s clashes</strong>
                                                <ul className="text-xs text-amber-900 space-y-1">{checkClashes(combo).map(clash => <li key={clash.key}>{clash.key}: {clash.items.map(item => item.code).join(" / ")}</li>)}</ul>
                                                {alternatives.length < 3 && <p className="text-xs text-amber-900">{alternatives.length ? `Only ${alternatives.length} distinct clash-free replacements found.` : (resolutionError || "No clash-free replacement found within the search limit. Change your selected courses and regenerate.")}</p>}
                                                {alternatives.map((alternative, repairIndex) => <div key={alternative.key} className="rounded border border-amber-200 bg-white p-3 text-xs space-y-2">
                                                    <strong>Replacement {repairIndex + 1} · Clash free · ~{alternative.metrics.walkingKm.toFixed(1)} km/week</strong>
                                                    <p>{alternative.metrics.days} campus days · {alternative.metrics.gaps} free periods</p>
                                                    {alternative.combo.filter(selection => selection.option.id !== combo.find(s => s.code === selection.code).option.id).map(selection => <p key={selection.code}><strong>{selection.code}</strong>: {combo.find(s => s.code === selection.code).option.slots.join(" + ")} → {selection.option.slots.join(" + ")} · {selection.option.faculty} · {selection.option.venue}</p>)}
                                                    <button type="button" onClick={() => {
                                                        if (checkClashes(alternative.combo).length) return;
                                                        setResults(previous => previous.map(result => result.profile.id === profile.id ? { ...result, combo: alternative.combo, metrics: alternative.metrics, resolved: true } : result));
                                                        setSelectedAlternative(profile.id);
                                                    }} className="px-3 py-2 rounded bg-emerald-700 text-white">Select replacement {repairIndex + 1} and resolve all clashes</button>
                                                </div>)}
                                            </div>}
                                            <div className={`text-xs ${metrics.clashPeriods ? 'text-amber-800' : 'text-emerald-700'}`}>{metrics.clashPeriods ? `${metrics.clashPeriods} conflicting periods · overlapping classes need resolution` : 'Clash free'} · {metrics.days} campus days · {metrics.gaps} free periods between classes</div>
                                            <div className="rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-2 text-xs text-emerald-800">
                                                <strong>~{metrics.walkingKm.toFixed(1)} km walking/week · {metrics.crossings} direct AB-02 crossings</strong>
                                                <p className="mt-1">Includes ~{metrics.hostelKm.toFixed(1)} km on {student.origin.toLowerCase()} legs and {metrics.lunchReturns} lunch returns. Online classes add no classroom travel. Short walks within AB-01 / LC / AR (including CR rooms) are excluded; distances are estimates.</p>
                                                <details className="mt-2">
                                                    <summary className="cursor-pointer font-medium">Daily walking routes</summary>
                                                    <ul className="mt-2 space-y-1">{metrics.dailyTravel.map(trip => <li key={trip.day}><strong>{trip.day}: ~{trip.km.toFixed(1)} km</strong> · {trip.route.join(' → ')}</li>)}</ul>
                                                </details>
                                                {metrics.unknownVenueClasses > 0 && <p className="mt-1 text-amber-800">Some venues are unspecified or unmapped; their walking distance is excluded.</p>}
                                            </div>
                                            <div className="space-y-2">
                                                {combo.map(s => (
                                                    <div key={s.code} className="text-xs text-slate-600">
                                                        <div><span className="font-bold">{s.code}</span> · {s.title}</div>
                                                        <div>{s.option.faculty} · {s.option.venue}</div>
                                                        <span className="font-mono text-blue-700">{s.option.slots.join(' + ')}</span>
                                                        <label className="block mt-2">
                                                            <span className="block text-[11px] font-medium text-slate-500 mb-1">Teacher &amp; room · same slots</span>
                                                            <select
                                                                aria-label={`${profile.name}: teacher and room for ${s.code}, same slots`}
                                                                value={s.option.id}
                                                                onChange={e => changeTeacher(profile.id, s.code, e.target.value)}
                                                                className="w-full min-w-0 rounded-md border border-slate-300 bg-white px-2 py-2 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                            >
                                                                {teacherChoices(s).map(({ option, location }) => (
                                                                    <option key={option.id} value={option.id}>{option.faculty} · {option.venue} · {location}</option>
                                                                ))}
                                                            </select>
                                                            <span className="block mt-1 text-[10px] text-slate-500">{teacherChoices(s).length > 1 ? 'Same building options first, then nearby buildings. All course slots stay fixed; no extra AB-02 crossings.' : 'No other teacher or room is listed in these exact slots within the same building group.'}</span>
                                                        </label>
                                                    </div>
                                                ))}
                                            </div>
                                            {selectedAlternative === profile.id && !checkClashes(combo).length && <details className="pt-2 border-t border-slate-100">
                                                <summary className="text-xs font-medium text-blue-700 cursor-pointer mb-2">View weekly timetable</summary>
                                                <TimetableGrid selections={combo} />
                                            </details>}
                                            <button disabled={selectedAlternative !== profile.id || checkClashes(combo).length > 0} onClick={() => { if (selectedAlternative === profile.id && !checkClashes(combo).length) onApply(combo); }} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs rounded font-medium">Create timetable with {profile.name}</button>
                                        </>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function CompareTab({ plans, activePlanId, onOpen }) {
            return (
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    {plans.map(p => {
                        const clashes = checkClashes(p.selections);
                        return (
                            <div key={p.id} className={`p-4 border rounded-xl bg-white shadow-sm space-y-3 ${p.id === activePlanId ? 'border-blue-500' : 'border-slate-200'}`}>
                                <div className="flex justify-between items-center gap-2">
                                    <h3 className="font-bold text-slate-800 truncate">{p.name}</h3>
                                    <span className={`text-xs px-2 py-0.5 rounded font-bold shrink-0 ${clashes.length ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {clashes.length ? `${clashes.length} Clashes` : 'Clash Free'}
                                    </span>
                                </div>
                                <div className="text-xs text-slate-500">Credits: <span className="font-bold text-slate-700">{totalCredits(p.selections)} / {MAX_CREDITS}</span> · Courses: <span className="font-bold text-slate-700">{p.selections.length}</span></div>
                                <div className="space-y-1.5 pt-2 border-t border-slate-200">
                                    {p.selections.length === 0 && <div className="text-xs text-slate-400">Empty plan</div>}
                                    {p.selections.map(s => (
                                        <div key={s.code} className="text-xs flex justify-between gap-2 bg-slate-50 p-2 rounded border border-slate-200">
                                            <span className="font-medium text-slate-700 truncate">{s.code} - {s.option.faculty}</span>
                                            <span className="font-mono text-blue-600 font-bold shrink-0">{s.option.slots.join('+')}</span>
                                        </div>
                                    ))}
                                </div>
                                {p.id !== activePlanId && (
                                    <button onClick={() => onOpen(p.id)} className="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-md hover:bg-slate-100">Open this plan</button>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ==========================================
        // 4. APP
        // ==========================================
        function App() {
            const [plans, setPlans] = useState(loadPlans);
            const [activePlanId, setActivePlanId] = useState(() => plans[0].id);
            const [tab, setTab] = useState('dashboard');

            useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(plans)); }, [plans]);

            const plan = plans.find(p => p.id === activePlanId) || plans[0];
            const clashes = useMemo(() => checkClashes(plan.selections), [plan.selections]);

            const updatePlan = (fn) => setPlans(ps => ps.map(p => p.id === plan.id ? { ...p, ...fn(p) } : p));

            const selectOption = (subject, option) => {
                const conflicts = slotConflicts(plan.selections, subject.code, option);
                if (conflicts.length) {
                    alert(`Cannot select this slot: already selected in ${conflicts.map(s => s.code).join(', ')}. Change or remove that selection first.`);
                    return;
                }
                const exists = plan.selections.some(s => s.code === subject.code);
                if (!exists && totalCredits(plan.selections) + subject.credits > MAX_CREDITS) {
                    alert(`Cannot add ${subject.code}: it would exceed the ${MAX_CREDITS} credit limit.`);
                    return;
                }
                updatePlan(p => ({
                    selections: exists
                        ? p.selections.map(s => s.code === subject.code ? { ...subject, option } : s)
                        : [...p.selections, { ...subject, option }]
                }));
            };
            const removeCourse = (code) => updatePlan(p => ({ selections: p.selections.filter(s => s.code !== code) }));

            const createPlan = () => {
                const name = prompt('Name for the new timetable plan:', `Plan ${plans.length + 1}`);
                if (!name) return;
                const np = { id: `plan-${Date.now()}`, name, selections: [] };
                setPlans(ps => [...ps, np]);
                setActivePlanId(np.id);
            };
            const renamePlan = () => {
                const name = prompt('Rename plan:', plan.name);
                if (name) updatePlan(() => ({ name }));
            };
            const duplicatePlan = () => {
                const np = { id: `plan-${Date.now()}`, name: `${plan.name} (Copy)`, selections: JSON.parse(JSON.stringify(plan.selections)) };
                setPlans(ps => [...ps, np]);
                setActivePlanId(np.id);
            };
            const deletePlan = () => {
                if (plans.length <= 1) return alert('You must keep at least one plan.');
                if (!confirm(`Delete "${plan.name}"?`)) return;
                const rest = plans.filter(p => p.id !== plan.id);
                setPlans(rest);
                setActivePlanId(rest[0].id);
            };
            const applyCombo = (combo) => {
                if (checkClashes(combo).length) return alert('Resolve all overlapping classes before creating a timetable.');
                if (totalCredits(combo) > MAX_CREDITS) return alert(`Cannot apply a timetable above ${MAX_CREDITS} credits.`);
                updatePlan(() => ({ selections: combo }));
                setTab('dashboard');
            };

            const exportCSV = () => {
                if (checkClashes(plan.selections).length) return alert('Resolve all overlapping classes before exporting this timetable.');
                const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
                const rows = [['Course Code', 'Course Title', 'Credits', 'Type', 'Faculty', 'Slots', 'Venue']]
                    .concat(plan.selections.map(s => [s.code, s.title, s.credits, s.type, s.option.faculty, s.option.slots.join('+'), s.option.venue]));
                const blob = new Blob([rows.map(r => r.map(esc).join(',')).join('\n')], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${plan.name.replace(/\s+/g, '_')}_FFCS.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const tabs = [
                { id: 'dashboard', label: 'Timetable', icon: Calendar },
                { id: 'subjects', label: 'Subjects', icon: BookOpen },
                { id: 'generator', label: 'Generator', icon: Sparkles },
                { id: 'compare', label: 'Compare Plans', icon: Columns }
            ];

            const iconBtn = 'p-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-700 transition-colors';

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="developer-strip">developed by MR PRANAV PATHAK</div>
                    <header className="institution-header">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="institution-mark" aria-hidden="true">VIT</div>
                                <div>
                                    <p className="institution-kicker">Academic planning · Student portal</p>
                                    <h1 className="font-bold text-lg leading-tight">VIT Bhopal FFCS Timetable Builder</h1>
                                    <p className="semester">Winter Semester 2026–27 · Fully Flexible Credit System</p>
                                </div>
                            </div>
                            <div className="no-print flex items-center gap-1 bg-slate-800 p-1.5 rounded-lg border border-slate-700">
                                <select value={plan.id} onChange={e => setActivePlanId(e.target.value)}
                                    className="bg-slate-900 text-white text-sm rounded-md px-2 py-1.5 border border-slate-600 focus:outline-none max-w-[220px]">
                                    {plans.map(p => <option key={p.id} value={p.id}>{p.name} ({p.selections.length})</option>)}
                                </select>
                                <button onClick={createPlan} title="New plan" className={iconBtn}><Plus size={16} /></button>
                                <button onClick={renamePlan} title="Rename plan" className={iconBtn}><Edit3 size={16} /></button>
                                <button onClick={duplicatePlan} title="Duplicate plan" className={iconBtn}><Copy size={16} /></button>
                                <button onClick={deletePlan} title="Delete plan" className="p-2 rounded-md text-slate-300 hover:text-red-400 hover:bg-slate-700"><Trash2 size={16} /></button>
                            </div>
                        </div>
                    </header>

                    <nav aria-label="Main navigation" className="portal-nav no-print">
                        <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap justify-between items-center gap-2">
                            <div className="flex gap-1 overflow-x-auto">
                                {tabs.map(t => (
                                    <button key={t.id} aria-current={tab === t.id ? 'page' : undefined} onClick={() => setTab(t.id)}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${tab === t.id ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>
                                        <t.icon size={16} /> {t.label}
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={exportCSV} className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium border border-slate-300 rounded-lg hover:bg-slate-100"><Download size={14} /> Export CSV</button>
                                <button onClick={() => { setTab('dashboard'); setTimeout(() => window.print(), 50); }} className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium border border-slate-300 rounded-lg hover:bg-slate-100"><Printer size={14} /> Print</button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                        <div className="page-intro"><div><p className="institution-kicker">VIT Bhopal / Academic planning</p><h2>{tabs.find(t => t.id === tab).label}</h2><p>{{ dashboard: 'Your weekly academic schedule, at a glance.', subjects: 'Explore courses, faculty and available class slots.', generator: 'Plan your semester with a maximum of 27 credits.', compare: 'Review your saved timetables side by side.' }[tab]}</p></div><span className="text-xs text-slate-500">Winter Semester 2026–27</span></div>
                        <div className="mb-4 flex items-center gap-2 text-sm text-slate-500">
                            <Clock size={14} /> Active plan: <span className="font-semibold text-slate-800">{plan.name}</span>
                        </div>
                        {tab === 'dashboard' && <>{plan.selections.length > 0 && <ReviewsSection />}<DashboardTab plan={plan} clashes={clashes} onRemove={removeCourse} /></>}
                        {tab === 'subjects' && <SubjectsTab plan={plan} onSelect={selectOption} onRemove={removeCourse} />}
                        {tab === 'generator' && <GeneratorTab onApply={applyCombo} />}
                        {tab === 'compare' && <CompareTab plans={plans} activePlanId={plan.id} onOpen={(id) => { setActivePlanId(id); setTab('dashboard'); }} />}
                    </main>

                    <footer className="portal-footer no-print text-center text-xs py-5 px-4">
                        <p className="font-semibold mb-1">VIT Bhopal · FFCS Timetable Builder</p>
                        <p>Plans are saved in your browser. Always confirm slots on the official VTOP portal.</p>
                        <p className="mt-2">Contact Pranav Pathak · <a className="underline break-all" href="mailto:pranavpathakscsr@gmail.com">pranavpathakscsr@gmail.com</a> · <a className="underline" href="tel:+918235491113">8235491113</a></p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
